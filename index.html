<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="description" content="SKILLUP — приложение для развития навыков за 30 дней">
  <title>SKILLUP — 30 дней развития</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="auth-pending">
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-mark">S</span><span>SKILL<span class="accent">UP</span></span></div>
      <div class="auth-copy">
        <div class="eyebrow">ТВОЙ ЛИЧНЫЙ ПРОГРЕСС</div>
        <h1 id="authTitle">Войти в SKILLUP</h1>
        <p id="authSubtitle">Сохраняй прогресс и продолжай обучение с любого устройства.</p>
      </div>
      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" type="button">Войти</button>
        <button id="signupTab" class="auth-tab" type="button">Регистрация</button>
      </div>
      <form id="authForm" class="auth-form">
        <div id="nameField" class="auth-field hidden">
          <label for="authName">Имя</label>
          <input id="authName" type="text" autocomplete="name" placeholder="Например, Абдуллох">
        </div>
        <div class="auth-field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label for="authPassword">Пароль</label>
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="Минимум 6 символов" required>
        </div>
        <button id="authSubmit" class="btn primary auth-submit" type="submit">Войти</button>
      </form>
      <div id="authMessage" class="auth-message" role="status"></div>
      <div class="auth-security">🔒 Данные прогресса защищены и доступны только твоему аккаунту.</div>
    </div>
  </div>

  <div id="appRoot">
  <div id="toast" class="toast"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand" data-route="home"><span class="brand-mark">S</span><span>SKILL<span class="accent">UP</span></span></div>
    <nav class="nav">
      <button class="nav-item active" data-route="home"><span>⌂</span>Главная</button>
      <button class="nav-item" data-route="learn"><span>◫</span>Обучение</button>
      <button class="nav-item" data-route="achievements"><span>★</span>Достижения</button>
      <button class="nav-item" data-route="profile"><span>◉</span>Профиль</button>
      <button class="nav-item" data-route="settings"><span>⚙</span>Настройки</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="streak-mini"><div class="streak-icon">🔥</div><div><div class="muted">Серия</div><strong id="sidebarStreak">0 дней</strong></div></div>
    </div>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenuBtn">☰</button>
      <span class="muted" id="routeLabel">Главная</span>
      
    </header>

    <section id="view-home" class="view active"></section>
    <section id="view-learn" class="view"></section>
    <section id="view-lesson" class="view"></section>
    <section id="view-achievements" class="view"></section>
    <section id="view-profile" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <div class="mobile-overlay" id="mobileOverlay"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
